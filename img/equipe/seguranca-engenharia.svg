<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#18365d" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05a28" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#engGrad)" />

  <!-- Círculos Concêntricos de Foco e Engenharia -->
  <g transform="translate(300, 220)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#23426d" stroke-width="1.5" stroke-dasharray="8,6" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#33598f" stroke-width="2" />
    
    <!-- Escudo Central de Segurança do Trabalho -->
    <path d="M -60 -70 L 60 -70 L 70 20 Q 0 90 -70 20 Z" fill="url(#shieldGrad)" />
    <path d="M -48 -58 L 48 -58 L 56 16 Q 0 74 -56 16 Z" fill="#0b1a30" />
    
    <!-- Ícone de Engenharia / Capacete e Compasso Técnico -->
    <path d="M -25 -10 Q 0 -35 25 -10 Z" fill="#ffffff" />
    <rect x="-30" y="-10" width="60" height="6" rx="3" fill="#ffc72c" />
    
    <!-- Check de Aprovação Técnica -->
    <path d="M -15 15 L -2 28 L 22 5" stroke="#ffc72c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Badges Flutuantes com Pilares de Confiança -->
  <!-- Badge 1: Engenheiro de Segurança do Trabalho -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#071222" stroke="#ffc72c" stroke-width="1.5" />
    <circle cx="35" cy="30" r="18" fill="#ffc72c" />
    <text x="35" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#0b1a30" text-anchor="middle">★</text>
    <text x="70" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">ENGENHEIROS DE</text>
    <text x="70" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#ffc72c">SEGURANÇA DO TRABALHO</text>
  </g>

  <!-- Badge 2: Conformidade Rigorosa NR-35 / NR-18 -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#071222" stroke="#f05a28" stroke-width="1.5" />
    <circle cx="35" cy="30" r="18" fill="#f05a28" />
    <text x="35" y="35" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">NR-35</text>
    <text x="70" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">PROFISSIONAIS</text>
    <text x="70" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#f05a28">ALTAMENTE CAPACITADOS</text>
  </g>

  <!-- Badge 3: Qualidade & Eficiência -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#071222" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="35" cy="30" r="18" fill="#38bdf8" />
    <text x="35" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#0b1a30" text-anchor="middle">✓</text>
    <text x="70" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">QUALIDADE &amp; EFICIÊNCIA</text>
    <text x="70" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#38bdf8">NA EXECUÇÃO DOS SERVIÇOS</text>
  </g>

  <!-- Badge 4: Responsabilidade Técnica -->
  <g transform="translate(320, 340)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#071222" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="30" r="18" fill="#10b981" />
    <text x="35" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">🛡</text>
    <text x="70" y="27" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">RESPONSABILIDADE TOTAL</text>
    <text x="70" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#10b981">CONSERVAÇÃO PATRIMONIAL</text>
  </g>
</svg>
