<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="galPintura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="12" fill="url(#galPintura)" />
  <!-- Ilustração do Projeto -->
  <g transform="translate(60, 40)">
    <rect x="40" y="30" width="400" height="280" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 40 30 L 260 30 L 220 310 L 40 310 Z" fill="#2563eb" opacity="0.85" />
    <g fill="#93c5fd" opacity="0.7">
      <rect x="70" y="60" width="45" height="55" rx="3" />
      <rect x="140" y="60" width="45" height="55" rx="3" />
      <rect x="220" y="60" width="45" height="55" rx="3" />
      <rect x="300" y="60" width="45" height="55" rx="3" />
      <rect x="70" y="140" width="45" height="55" rx="3" />
      <rect x="140" y="140" width="45" height="55" rx="3" />
      <rect x="220" y="140" width="45" height="55" rx="3" />
      <rect x="300" y="140" width="45" height="55" rx="3" />
    </g>
    <!-- Balancim e Pintura -->
    <line x1="200" y1="0" x2="200" y2="160" stroke="#ffc72c" stroke-width="3" stroke-dasharray="6,3" />
    <line x1="330" y1="0" x2="330" y2="160" stroke="#ffc72c" stroke-width="3" stroke-dasharray="6,3" />
    <rect x="180" y="160" width="170" height="14" rx="3" fill="#f05a28" />
  </g>
  <!-- Overlay Informativo -->
  <rect x="0" y="360" width="600" height="90" fill="#071222" opacity="0.95" />
  <rect x="30" y="378" width="100" height="24" rx="12" fill="#2563eb" />
  <text x="80" y="394" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">PINTURA</text>
  <text x="145" y="395" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#ffffff">Pintura e Restauração Predial</text>
  <text x="30" y="430" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="12" fill="#94a3b8">Serviço de repintura e acabamento com proteção contra intempéries</text>
</svg>
