<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#192333" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="treatedSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradF)" />

  <g transform="translate(90, 50)">
    <!-- Viga / Pilar de Concreto Armado Exposto -->
    <path d="M 30 20 L 390 20 L 390 270 L 30 270 Z" fill="#334155" stroke="#475569" stroke-width="2" rx="6" />
    
    <!-- Região com Desplacamento de Concreto -->
    <path d="M 80 70 Q 200 40 320 80 Q 360 170 310 240 Q 180 270 90 220 Z" fill="#1e293b" />

    <!-- Vergalhões de Aço - Lado Esquerdo Oxidado vs Lado Direito Tratado -->
    <!-- Barra 1 -->
    <rect x="120" y="80" width="16" height="150" rx="4" fill="url(#rustGrad)" />
    <!-- Nervuras do Vergalhão Oxidado -->
    <line x1="120" y1="100" x2="136" y2="95" stroke="#7c2d12" stroke-width="2" />
    <line x1="120" y1="130" x2="136" y2="125" stroke="#7c2d12" stroke-width="2" />
    <line x1="120" y1="160" x2="136" y2="155" stroke="#7c2d12" stroke-width="2" />
    <line x1="120" y1="190" x2="136" y2="185" stroke="#7c2d12" stroke-width="2" />

    <!-- Barra 2 - Transição / Tratamento Anticorrosivo -->
    <rect x="200" y="70" width="16" height="170" rx="4" fill="url(#rustGrad)" />
    <rect x="200" y="70" width="16" height="90" rx="4" fill="url(#treatedSteel)" />

    <!-- Barra 3 - 100% Tratada e Passivada com Primer de Zinco -->
    <rect x="280" y="80" width="16" height="150" rx="4" fill="url(#treatedSteel)" />
    <line x1="280" y1="100" x2="296" y2="95" stroke="#e0f2fe" stroke-width="2" />
    <line x1="280" y1="130" x2="296" y2="125" stroke="#e0f2fe" stroke-width="2" />
    <line x1="280" y1="160" x2="296" y2="155" stroke="#e0f2fe" stroke-width="2" />
    <line x1="280" y1="190" x2="296" y2="185" stroke="#e0f2fe" stroke-width="2" />

    <!-- Estribos Estruturais -->
    <line x1="100" y1="110" x2="310" y2="110" stroke="#f05a28" stroke-width="4" />
    <line x1="100" y1="180" x2="310" y2="180" stroke="#ffc72c" stroke-width="4" />

    <!-- Escova de Aço / Ferramenta de Tratamento -->
    <g transform="translate(140, 120) rotate(35)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#0b1a30" stroke="#ffc72c" stroke-width="2" />
      <line x1="10" y1="24" x2="10" y2="38" stroke="#cbd5e1" stroke-width="2" />
      <line x1="25" y1="24" x2="25" y2="38" stroke="#cbd5e1" stroke-width="2" />
      <line x1="40" y1="24" x2="40" y2="38" stroke="#cbd5e1" stroke-width="2" />
      <line x1="55" y1="24" x2="55" y2="38" stroke="#cbd5e1" stroke-width="2" />
      <line x1="70" y1="24" x2="70" y2="38" stroke="#cbd5e1" stroke-width="2" />
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="330" y="30" width="240" height="34" rx="17" fill="#f05a28" />
  <text x="450" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRATAMENTO DE FERRAGENS</text>
</svg>
