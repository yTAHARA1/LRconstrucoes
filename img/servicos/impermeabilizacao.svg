<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#0f3057" />
    </linearGradient>
    <linearGradient id="membraneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradI)" />

  <g transform="translate(100, 60)">
    <!-- Reservatório / Piscina / Laje em Corte Isométrico -->
    <!-- Base Estrutural de Concreto -->
    <polygon points="200,20 380,90 200,160 20,90" fill="#334155" stroke="#475569" stroke-width="2" />
    <polygon points="20,90 200,160 200,260 20,190" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <polygon points="200,160 380,90 380,190 200,260" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Manta Asfáltica / Membrana Impermeabilizante de Poliuretano em Camadas -->
    <polygon points="200,40 350,100 200,155 50,100" fill="url(#membraneGrad)" opacity="0.95" />
    
    <!-- Lâmina de Água Estanque Testada sem Infiltração -->
    <polygon points="200,60 320,105 200,150 80,105" fill="url(#waterGrad)" />
    
    <!-- Gotas de Água Repelidas / Efeito Lótus de Hidrorepelência -->
    <g transform="translate(180, 20)">
      <path d="M 20 0 C 20 -15 0 -25 0 -40 C 0 -25 -20 -15 -20 0 C -20 15 20 15 20 0 Z" fill="#38bdf8" />
      <circle cx="-5" cy="-10" r="4" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Escudo Protetor contra Infiltração -->
    <g transform="translate(290, 160)">
      <path d="M 0 0 L 60 0 L 60 45 Q 30 75 0 45 Z" fill="#0b1a30" stroke="#ffc72c" stroke-width="3" />
      <path d="M 18 30 L 28 40 L 44 20" stroke="#ffc72c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="30" y="-10" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#ffc72c" text-anchor="middle">ESTANQUEIDADE</text>
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="360" y="30" width="210" height="34" rx="17" fill="#0284c7" />
  <text x="465" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">IMPERMEABILIZAÇÃO</text>
</svg>
