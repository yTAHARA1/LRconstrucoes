<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#163863" />
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc72c" />
      <stop offset="100%" stop-color="#f05a28" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradA)" />

  <g transform="translate(100, 20)">
    <!-- Silhueta da Fachada em Altura -->
    <rect x="20" y="0" width="160" height="360" fill="#1e293b" />
    <g fill="#475569" opacity="0.5">
      <rect x="40" y="30" width="30" height="40" rx="2" />
      <rect x="90" y="30" width="30" height="40" rx="2" />
      <rect x="40" y="90" width="30" height="40" rx="2" />
      <rect x="90" y="90" width="30" height="40" rx="2" />
      <rect x="40" y="150" width="30" height="40" rx="2" />
      <rect x="90" y="150" width="30" height="40" rx="2" />
      <rect x="40" y="210" width="30" height="40" rx="2" />
      <rect x="90" y="210" width="30" height="40" rx="2" />
      <rect x="40" y="270" width="30" height="40" rx="2" />
      <rect x="90" y="270" width="30" height="40" rx="2" />
    </g>

    <!-- Ponto de Ancoragem Estrutural NR-35 no Topo -->
    <circle cx="280" cy="15" r="12" fill="#0b1a30" stroke="#ffc72c" stroke-width="4" />
    <rect x="250" y="10" width="60" height="8" rx="4" fill="#ffc72c" />

    <!-- Cordas Duplas de Segurança (Linha de Trabalho e Linha de Vida / Trava-quedas) -->
    <line x1="275" y1="20" x2="275" y2="360" stroke="url(#ropeGrad)" stroke-width="3.5" stroke-dasharray="6,3" />
    <line x1="285" y1="20" x2="285" y2="360" stroke="#ffc72c" stroke-width="3" />

    <!-- Profissional Alpinista Industrial em Suspensão -->
    <g transform="translate(245, 140)">
      <!-- Capacete com Jugular e Faixa Refletiva -->
      <path d="M 25 15 Q 35 -2 45 15 Z" fill="#ffffff" stroke="#0b1a30" stroke-width="2" />
      <rect x="28" y="10" width="14" height="4" fill="#f05a28" />

      <!-- Cabeça -->
      <circle cx="35" cy="22" r="10" fill="#fbcfe8" />

      <!-- Cinto Paraquedista / Harness Completo -->
      <path d="M 20 32 L 50 32 L 46 70 L 24 70 Z" fill="#f05a28" />
      <line x1="22" y1="32" x2="48" y2="70" stroke="#ffc72c" stroke-width="3" />
      <line x1="48" y1="32" x2="22" y2="70" stroke="#ffc72c" stroke-width="3" />

      <!-- Cadeira Suspensa / Assento Ergonômico -->
      <rect x="10" y="70" width="50" height="8" rx="3" fill="#0b1a30" />
      <line x1="10" y1="50" x2="10" y2="70" stroke="#cbd5e1" stroke-width="2" />
      <line x1="60" y1="50" x2="60" y2="70" stroke="#cbd5e1" stroke-width="2" />

      <!-- Pernas / Calça e Botina com Bico de Aço -->
      <rect x="20" y="76" width="12" height="40" rx="3" fill="#1e293b" />
      <rect x="38" y="76" width="12" height="40" rx="3" fill="#1e293b" />
      <rect x="16" y="112" width="18" height="10" rx="3" fill="#0f172a" />
      <rect x="36" y="112" width="18" height="10" rx="3" fill="#0f172a" />

      <!-- Braços com Ferramenta -->
      <line x1="20" y1="38" x2="-20" y2="55" stroke="#f05a28" stroke-width="7" stroke-linecap="round" />
      <circle cx="-20" cy="55" r="5" fill="#fbcfe8" />
      <!-- Mosquetões e Trava-quedas -->
      <ellipse cx="35" cy="40" rx="5" ry="8" fill="none" stroke="#ffc72c" stroke-width="3" />
    </g>

    <!-- Selo NR-35 Segurança Total -->
    <g transform="translate(30, 20)">
      <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#0b1a30" stroke="#ffc72c" stroke-width="2.5" />
      <text x="35" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffc72c" text-anchor="middle">NR-35</text>
      <text x="35" y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8" fill="#ffffff" text-anchor="middle">SEGURANÇA</text>
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="330" y="30" width="240" height="34" rx="17" fill="#f05a28" />
  <text x="450" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SERVIÇOS EM ALTURA</text>
</svg>
