<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="solarPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc72c" />
      <stop offset="100%" stop-color="#f05a28" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradSolar)" />

  <!-- Sol / Energia e Eficiência Fotovoltaica -->
  <g transform="translate(480, 80)">
    <circle cx="0" cy="0" r="45" fill="url(#sunGlow)" opacity="0.85" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ffc72c" stroke-width="2" stroke-dasharray="8,6" opacity="0.5" />
  </g>

  <g transform="translate(70, 70)">
    <!-- Painel Solar Fotovoltaico em Perspectiva -->
    <polygon points="120,50 360,50 420,240 60,240" fill="url(#solarPanel)" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Divisões de Células Fotovoltaicas -->
    <!-- Linhas Horizontais -->
    <line x1="105" y1="100" x2="375" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="90" y1="150" x2="390" y2="150" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="75" y1="200" x2="405" y2="200" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

    <!-- Linhas Verticais com Perspectiva -->
    <line x1="180" y1="50" x2="150" y2="240" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="240" y1="50" x2="240" y2="240" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <line x1="300" y1="50" x2="330" y2="240" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

    <!-- Lado Esquerdo Sujo (Poeira/Poluição) vs Lado Direito 100% Limpo e Eficiente -->
    <polygon points="120,50 240,50 240,240 60,240" fill="#78350f" opacity="0.35" />
    <polygon points="240,50 360,50 420,240 240,240" fill="#38bdf8" opacity="0.2" />

    <!-- Equipamento de Limpeza Especializada (Sem Abrasão / Escova Macia com Água Pura) -->
    <g transform="translate(180, 80) rotate(15)">
      <!-- Haste Telescópica de Fibra de Carbono -->
      <line x1="0" y1="0" x2="0" y2="140" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <!-- Cabeçote da Escova Giratória Especializada -->
      <rect x="-40" y="-12" width="80" height="24" rx="6" fill="#f05a28" />
      <g stroke="#ffffff" stroke-width="2">
        <line x1="-30" y1="-12" x2="-30" y2="-20" />
        <line x1="-15" y1="-12" x2="-15" y2="-20" />
        <line x1="0" y1="-12" x2="0" y2="-20" />
        <line x1="15" y1="-12" x2="15" y2="-20" />
        <line x1="30" y1="-12" x2="30" y2="-20" />
      </g>
      <!-- Gotas e Brilho de Limpeza -->
      <circle cx="-15" cy="-25" r="3" fill="#38bdf8" />
      <circle cx="20" cy="-28" r="4" fill="#ffffff" />
    </g>

    <!-- Indicador de Rendimento Energético Restaurado -->
    <g transform="translate(320, 160)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#0b1a30" stroke="#ffc72c" stroke-width="2" />
      <text x="55" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffc72c" text-anchor="middle">+30% EFICIÊNCIA</text>
      <text x="55" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">CONSERVAÇÃO TOTAL</text>
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="290" y="30" width="280" height="34" rx="17" fill="#ffc72c" />
  <text x="430" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#0b1a30" text-anchor="middle" letter-spacing="0.5">LIMPEZA DE PLACAS SOLARES</text>
</svg>
