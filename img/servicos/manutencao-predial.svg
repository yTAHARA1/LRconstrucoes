<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradM)" />

  <g transform="translate(80, 50)">
    <!-- Conjunto de Edificações / Condomínio -->
    <!-- Prédio 1 -->
    <rect x="50" y="80" width="90" height="220" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <g fill="#93c5fd" opacity="0.6">
      <rect x="65" y="100" width="20" height="25" rx="2" />
      <rect x="105" y="100" width="20" height="25" rx="2" />
      <rect x="65" y="140" width="20" height="25" rx="2" />
      <rect x="105" y="140" width="20" height="25" rx="2" />
      <rect x="65" y="180" width="20" height="25" rx="2" />
      <rect x="105" y="180" width="20" height="25" rx="2" />
      <rect x="65" y="220" width="20" height="25" rx="2" />
      <rect x="105" y="220" width="20" height="25" rx="2" />
    </g>

    <!-- Prédio Central 2 -->
    <rect x="160" y="30" width="130" height="270" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <g fill="#ffc72c" opacity="0.75">
      <rect x="180" y="60" width="25" height="30" rx="2" />
      <rect x="225" y="60" width="25" height="30" rx="2" />
      <rect x="260" y="60" width="15" height="30" rx="2" />
      <rect x="180" y="110" width="25" height="30" rx="2" />
      <rect x="225" y="110" width="25" height="30" rx="2" />
      <rect x="260" y="110" width="15" height="30" rx="2" />
      <rect x="180" y="160" width="25" height="30" rx="2" />
      <rect x="225" y="160" width="25" height="30" rx="2" />
      <rect x="260" y="160" width="15" height="30" rx="2" />
      <rect x="180" y="210" width="25" height="30" rx="2" />
      <rect x="225" y="210" width="25" height="30" rx="2" />
      <rect x="260" y="210" width="15" height="30" rx="2" />
    </g>

    <!-- Prancheta / Checklist de Engenharia e Inspeção -->
    <g transform="translate(270, 70)">
      <!-- Prancheta Base -->
      <rect x="0" y="0" width="160" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
      <rect x="40" y="-10" width="80" height="20" rx="6" fill="#334155" />
      <circle cx="80" cy="0" r="4" fill="#f05a28" />

      <!-- Linhas de Inspeção com Check -->
      <!-- Item 1 -->
      <circle cx="25" cy="40" r="10" fill="url(#checkGrad)" />
      <path d="M 20 40 L 24 44 L 30 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="45" y="36" width="95" height="8" rx="4" fill="#64748b" />

      <!-- Item 2 -->
      <circle cx="25" cy="75" r="10" fill="url(#checkGrad)" />
      <path d="M 20 75 L 24 79 L 30 71" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="45" y="71" width="85" height="8" rx="4" fill="#64748b" />

      <!-- Item 3 -->
      <circle cx="25" cy="110" r="10" fill="url(#checkGrad)" />
      <path d="M 20 110 L 24 114 L 30 106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="45" y="106" width="90" height="8" rx="4" fill="#64748b" />

      <!-- Item 4 -->
      <circle cx="25" cy="145" r="10" fill="url(#checkGrad)" />
      <path d="M 20 145 L 24 149 L 30 141" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="45" y="141" width="75" height="8" rx="4" fill="#64748b" />

      <!-- Selo LR Aprovado -->
      <rect x="35" y="170" width="90" height="24" rx="4" fill="#0b1a30" />
      <text x="80" y="186" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#ffc72c" text-anchor="middle">CONSERVADO</text>
    </g>
  </g>

  <rect x="350" y="30" width="220" height="34" rx="17" fill="#0b1a30" stroke="#ffc72c" stroke-width="1.5" />
  <text x="460" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffc72c" text-anchor="middle" letter-spacing="0.5">MANUTENÇÃO PREDIAL</text>
</svg>
