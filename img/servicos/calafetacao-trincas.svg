<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sealantGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05a28" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradC)" />

  <g transform="translate(100, 60)">
    <!-- Parede Estrutural de Concreto -->
    <rect x="0" y="0" width="400" height="280" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    
    <!-- Textura de Concreto -->
    <line x1="40" y1="50" x2="120" y2="50" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4" />
    <line x1="260" y1="200" x2="360" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10,5" />

    <!-- Trinca / Fissura Estrutural Tratada -->
    <!-- Fissura crua não tratada na parte superior -->
    <path d="M 200 0 L 195 40 L 210 80 L 190 120" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 210 80 L 235 95" stroke="#0f172a" stroke-width="3" fill="none" />
    <path d="M 195 40 L 175 60" stroke="#0f172a" stroke-width="2.5" fill="none" />

    <!-- Tratamento com Mastique / Selante PU em Calafetação -->
    <path d="M 190 120 L 205 160 L 190 200 L 210 240 L 200 280" stroke="url(#sealantGrad)" stroke-width="10" fill="none" stroke-linecap="round" />

    <!-- Aplicador de Calafetação Profissional -->
    <g transform="translate(140, 110) rotate(-25)">
      <!-- Tubo de PU / Selante -->
      <rect x="0" y="0" width="130" height="36" rx="4" fill="#ffc72c" stroke="#d97706" stroke-width="2" />
      <text x="65" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#0b1a30" text-anchor="middle">PU MASTIC</text>
      <!-- Bico Aplicador -->
      <polygon points="130,10 160,18 130,26" fill="#ffffff" />
      <!-- Estrutura da Pistola de Calafetar -->
      <path d="M -30 18 L 0 18" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
      <rect x="-40" y="5" width="12" height="26" rx="2" fill="#64748b" />
      <rect x="-20" y="36" width="18" height="45" rx="3" fill="#f05a28" />
    </g>
    
    <!-- Selo de Proteção e Estanqueidade -->
    <g transform="translate(290, 40)">
      <circle cx="35" cy="35" r="32" fill="#0b1a30" stroke="#ffc72c" stroke-width="3" />
      <path d="M 22 35 L 32 45 L 50 24" stroke="#ffc72c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="35" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#ffc72c" text-anchor="middle">100% VEDADO</text>
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="340" y="30" width="230" height="34" rx="17" fill="url(#sealantGrad)" />
  <text x="455" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRATAMENTO DE TRINCAS</text>
</svg>
