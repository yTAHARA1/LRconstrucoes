<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#143459" />
    </linearGradient>
    <linearGradient id="waterJet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glassClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGradL)" />

  <!-- Fachada de Vidro Espelhada -->
  <g transform="translate(100, 40)">
    <!-- Painéis de Vidro Estrutural -->
    <rect x="0" y="20" width="400" height="300" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3" />
    
    <!-- Reflexos de Luz e Vidro Limpo -->
    <polygon points="0,20 180,20 80,320 0,320" fill="url(#glassClean)" opacity="0.3" />
    <polygon points="200,20 380,20 280,320 100,320" fill="url(#glassClean)" opacity="0.2" />

    <!-- Grade de Pele de Vidro -->
    <line x1="100" y1="20" x2="100" y2="320" stroke="#475569" stroke-width="2" />
    <line x1="200" y1="20" x2="200" y2="320" stroke="#475569" stroke-width="2" />
    <line x1="300" y1="20" x2="300" y2="320" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="120" x2="400" y2="120" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="220" x2="400" y2="220" stroke="#475569" stroke-width="2" />

    <!-- Jato de Hidrojateamento de Alta Pressão -->
    <g transform="translate(150, 110)">
      <!-- Pistola de Limpeza -->
      <line x1="180" y1="10" x2="90" y2="40" stroke="#f05a28" stroke-width="6" stroke-linecap="round" />
      <rect x="175" y="5" width="20" height="25" rx="3" fill="#0b1a30" />
      <path d="M 190 25 Q 210 60 210 150" stroke="#ffc72c" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Jato de Água em Alta Pressão -->
      <polygon points="90,40 0,10 0,80" fill="url(#waterJet)" opacity="0.8" />
      <!-- Gotas e Brilho de Limpeza -->
      <circle cx="-10" cy="20" r="4" fill="#ffffff" />
      <circle cx="15" cy="-5" r="3" fill="#38bdf8" />
      <circle cx="-25" cy="50" r="5" fill="#e0f2fe" />
      <circle cx="20" cy="70" r="3" fill="#ffffff" />
      <!-- Estrela de Brilho de Vidro Limpo -->
      <path d="M 50 150 L 55 160 L 65 165 L 55 170 L 50 180 L 45 170 L 35 165 L 45 160 Z" fill="#ffffff" />
      <path d="M 280 60 L 283 68 L 291 71 L 283 74 L 280 82 L 277 74 L 269 71 L 277 68 Z" fill="#ffc72c" />
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="390" y="30" width="180" height="34" rx="17" fill="#0284c7" />
  <text x="480" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">LIMPEZA DE FACHADAS</text>
</svg>
