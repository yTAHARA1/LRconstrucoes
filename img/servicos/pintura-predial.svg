<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#19375e" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05a28" />
      <stop offset="100%" stop-color="#ff8533" />
    </linearGradient>
    <linearGradient id="wallPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo do Card Ilustrativo -->
  <rect width="600" height="400" rx="16" fill="url(#bgGradP)" />

  <!-- Grade Arquitetônica de Fundo -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
  </g>

  <!-- Edifício em Pintura -->
  <g transform="translate(80, 50)" filter="url(#cardShadow)">
    <!-- Corpo do Prédio -->
    <rect x="50" y="30" width="340" height="300" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Faixa Pintada de Alto Desempenho -->
    <path d="M 50 30 L 250 30 L 210 330 L 50 330 Z" fill="url(#wallPaint)" opacity="0.85" />
    
    <!-- Janelas do Edifício -->
    <g fill="#93c5fd" opacity="0.75">
      <rect x="75" y="60" width="40" height="50" rx="3" />
      <rect x="140" y="60" width="40" height="50" rx="3" />
      <rect x="210" y="60" width="40" height="50" rx="3" />
      <rect x="280" y="60" width="40" height="50" rx="3" />

      <rect x="75" y="140" width="40" height="50" rx="3" />
      <rect x="140" y="140" width="40" height="50" rx="3" />
      <rect x="210" y="140" width="40" height="50" rx="3" />
      <rect x="280" y="140" width="40" height="50" rx="3" />

      <rect x="75" y="220" width="40" height="50" rx="3" />
      <rect x="140" y="220" width="40" height="50" rx="3" />
      <rect x="210" y="220" width="40" height="50" rx="3" />
      <rect x="280" y="220" width="40" height="50" rx="3" />
    </g>

    <!-- Linhas de Andaime Suspenso / Balancim -->
    <line x1="200" y1="0" x2="200" y2="180" stroke="#ffc72c" stroke-width="3" stroke-dasharray="8,4" />
    <line x1="320" y1="0" x2="320" y2="180" stroke="#ffc72c" stroke-width="3" stroke-dasharray="8,4" />

    <!-- Plataforma suspensa -->
    <rect x="185" y="180" width="150" height="12" rx="3" fill="#f05a28" />
    <line x1="185" y1="160" x2="185" y2="180" stroke="#f05a28" stroke-width="3" />
    <line x1="335" y1="160" x2="335" y2="180" stroke="#f05a28" stroke-width="3" />
    <line x1="185" y1="160" x2="335" y2="160" stroke="#f05a28" stroke-width="2" />

    <!-- Rolo de Pintura Profissional -->
    <g transform="translate(180, 70) rotate(-15)">
      <rect x="0" y="0" width="60" height="20" rx="5" fill="url(#orangeGrad)" />
      <path d="M 30 20 L 30 45 L 60 45 L 60 85" stroke="#cbd5e1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="52" y="85" width="16" height="40" rx="4" fill="#0b1a30" />
      <path d="M 0 10 Q 30 -5 60 10" stroke="#ffc72c" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- Tag de Destaque -->
  <rect x="420" y="30" width="150" height="34" rx="17" fill="url(#orangeGrad)" />
  <text x="495" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">PINTURA PREDIAL</text>
</svg>
