<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <defs>
    <linearGradient id="lrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05a28" />
      <stop offset="100%" stop-color="#ff7e47" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#19375e" />
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc72c" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Simbolo / Icone -->
  <g transform="translate(10, 8)">
    <!-- Escudo / Estrutura base -->
    <path d="M 12 5 L 76 5 L 84 55 Q 48 92 12 55 Z" fill="url(#navyGrad)" />
    <!-- Viga / Detalhe de Construção e Trabalho em Altura -->
    <path d="M 22 15 L 66 15 L 72 50 Q 48 78 22 50 Z" fill="#071222" opacity="0.6"/>
    <!-- Linhas de ancoragem e cabo de segurança em amarelo -->
    <path d="M 48 8 L 48 75" stroke="url(#yellowAccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,3" />
    <circle cx="48" cy="22" r="5" fill="#ffc72c" />
    <circle cx="48" cy="62" r="4" fill="#f05a28" />

    <!-- Letras LR estilizadas no emblema -->
    <text x="31" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="-1">L</text>
    <text x="47" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="url(#lrGrad)" letter-spacing="-1">R</text>

    <!-- Base do gancho de segurança / Viga laranja -->
    <rect x="26" y="58" width="44" height="4" rx="2" fill="url(#lrGrad)" />
  </g>

  <!-- Tipografia da Marca -->
  <!-- LR Principal -->
  <text x="110" y="52" font-family="'Plus Jakarta Sans', 'Outfit', Arial, sans-serif" font-weight="900" font-size="44" fill="#0b1a30" letter-spacing="1">
    LR
  </text>
  
  <!-- Linha divisória de segurança laranja/amarela -->
  <rect x="180" y="24" width="3" height="32" rx="1.5" fill="url(#lrGrad)" />

  <!-- Texto Complementar: SERVIÇOS E MANUTENÇÃO -->
  <text x="195" y="38" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#0b1a30" letter-spacing="3.5">
    SERVIÇOS
  </text>
  <text x="195" y="55" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#f05a28" letter-spacing="4">
    E MANUTENÇÃO
  </text>

  <!-- Tagline institucional abaixo -->
  <text x="112" y="78" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" fill="#52647c" letter-spacing="1.2">
    MANUTENÇÃO PREDIAL &bull; SERVIÇOS EM ALTURA &bull; ENGENHARIA
  </text>
</svg>
